server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

spring:

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/mi-realm
          jwk-set-uri: http://host.docker.internal:8080/realms/mi-realm/protocol/openid-connect/certs
