server:
  port: 8081

spring:

  datasource:
    url: jdbc:postgresql://postgres:5432/user_service
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.local:8080/realms/mi-realm
